version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exportguard_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exportguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exportguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-exportguard_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exportguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exportguard_backend_prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-exportguard}:${POSTGRES_PASSWORD:-exportguard_secret}@postgres:5432/${POSTGRES_DB:-exportguard_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      TEAM_USERNAME: ${TEAM_USERNAME:-team}
      TEAM_PASSWORD: ${TEAM_PASSWORD:?TEAM_PASSWORD must be set}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
      WATSONX_URL: ${WATSONX_URL:-}
      OCR_LANG: ${OCR_LANG:-eng}
      NUMERIC_TOLERANCE: ${NUMERIC_TOLERANCE:-0.01}
      TASK_BACKEND: ${TASK_BACKEND:-local}
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exportguard_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata_prod:
  uploads_prod:
