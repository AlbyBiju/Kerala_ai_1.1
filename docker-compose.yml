version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exportguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exportguard
      POSTGRES_PASSWORD: exportguard_secret
      POSTGRES_DB: exportguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exportguard_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://exportguard:exportguard_secret@postgres:5432/exportguard_db}
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-change-me}
      TEAM_USERNAME: ${TEAM_USERNAME:-team}
      TEAM_PASSWORD: ${TEAM_PASSWORD:-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-documents}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exportguard_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
